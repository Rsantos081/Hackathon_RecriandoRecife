$kind: http-example
request:
  url: "{{baseUrl}}/api/products/:product_id"
  method: GET
  headers:
    Accept: "*/*"
  pathVariables:
    - key: product_id
      value: "2348"
      disabled: false
      description: Product ID to retrieve details
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: "*/*"
  body:
