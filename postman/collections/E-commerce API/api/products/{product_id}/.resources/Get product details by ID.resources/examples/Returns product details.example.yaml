      {
        "id": 833,
        "name": "string",
        "price": 3052.1084346280736,
        "description": "string"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer"
          },
          "name": {
            "type": "string"
          },
          "price": {
            "type": "number"
          },
          "description": {
            "type": "string"
          }
        }
      }
order: 1000
